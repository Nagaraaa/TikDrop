name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release vX.Y.Z (VERSION in app.py) from main
        type: choice
        options: [none, draft, publish]
        default: none

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v

  windows:
    name: Windows build
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build with Construire.cmd
        shell: cmd
        run: |
          python -m venv .venv || exit /b 1
          call Construire.cmd
      - name: Smoke test of the executable
        # The windowed exe must start, read the batch on stdin, load yt-dlp and
        # curl_cffi, and report every video on stdout (these ids do not exist).
        shell: pwsh
        timeout-minutes: 5
        run: |
          Set-Content urls.txt 'https://www.tiktok.com/@tikdrop/video/1', 'https://www.tiktok.com/@tikdrop/video/2'
          Start-Process dist\TikDrop\TikDrop.exe -Wait -NoNewWindow `
            -RedirectStandardInput urls.txt -RedirectStandardOutput smoke.txt `
            -ArgumentList '--worker', "$env:RUNNER_TEMP"
          Get-Content smoke.txt
          $events = Get-Content smoke.txt | ForEach-Object { $_ | ConvertFrom-Json }
          $ended = @($events | Where-Object type -eq 'end').Count
          if ($ended -ne 2) { throw "Expected 2 finished videos from one worker, got $ended" }
          if (-not ($events | Where-Object type -eq 'error')) { throw 'No error reported for the missing videos' }
          if (Select-String -Path smoke.txt -Pattern 'no impersonate target' -Quiet) { throw 'curl_cffi is missing from the build' }
      - name: Sources archive
        run: git archive --format=zip --prefix=source/ -o dist/TikDrop-Sources.zip HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: TikDrop-Windows
          path: |
            dist/TikDrop-Windows.zip
            dist/TikDrop-Sources.zip
          if-no-files-found: error

  release:
    name: Release
    # A pushed vX.Y.Z tag (draft), or the "Run workflow" button on main with
    # release = draft or publish.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && (inputs.release == 'draft' || inputs.release == 'publish'))
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release tag from VERSION in app.py
        run: |
          tag="v$(sed -n "s/^VERSION = '\(.*\)'$/\1/p" app.py)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION in app.py ($tag)"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: TikDrop-Windows
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.release == 'publish' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            # Fails if the tag already exists, so a release is never moved silently.
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent \
              || { echo "::error::Tag $TAG already exists: bump VERSION in app.py first"; exit 1; }
          fi
          # French notes from distribution/notes/vX.Y.Z.md when present.
          notes=distribution/notes/$TAG.md
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          if [ "$PUBLISH" != true ]; then set -- "$@" --draft; fi
          gh release create "$TAG" release/TikDrop-Windows.zip release/TikDrop-Sources.zip \
            --title "TikDrop $TAG" "$@"
