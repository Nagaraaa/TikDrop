name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v

  windows:
    name: Windows build
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build with Construire.cmd
        shell: cmd
        run: |
          python -m venv .venv || exit /b 1
          call Construire.cmd
      - name: Smoke test of the executable
        # The windowed exe must start, load yt-dlp and curl_cffi, and report
        # through its worker event stream (the video id does not exist).
        shell: pwsh
        timeout-minutes: 5
        run: |
          Start-Process dist\TikDrop\TikDrop.exe -Wait -NoNewWindow -RedirectStandardOutput smoke.txt `
            -ArgumentList '--worker', 'https://www.tiktok.com/@tikdrop/video/1', "$env:RUNNER_TEMP"
          Get-Content smoke.txt
          $events = Get-Content smoke.txt | ForEach-Object { $_ | ConvertFrom-Json }
          if (-not ($events | Where-Object type -eq 'error')) { throw 'No event received from the worker' }
          if (Select-String -Path smoke.txt -Pattern 'no impersonate target' -Quiet) { throw 'curl_cffi is missing from the build' }
      - name: Sources archive
        run: git archive --format=zip --prefix=source/ -o dist/TikDrop-Sources.zip HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: TikDrop-Windows
          path: |
            dist/TikDrop-Windows.zip
            dist/TikDrop-Sources.zip
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match VERSION in app.py
        run: |
          version=$(sed -n "s/^VERSION = '\(.*\)'$/\1/p" app.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION = '$version' in app.py"
            exit 1
          fi
      - uses: actions/download-artifact@v6
        with:
          name: TikDrop-Windows
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/TikDrop-Windows.zip release/TikDrop-Sources.zip \
            --draft --title "TikDrop $GITHUB_REF_NAME" --generate-notes
